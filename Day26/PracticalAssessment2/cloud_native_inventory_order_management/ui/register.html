<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/styles.css?v=20260228b">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Inventory System</a>
      <div class="navbar-nav ms-auto" id="authNav"></div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div id="authMessage" class="alert d-none"></div>
        <div class="card page-card fade-up">
          <div class="card-body p-4">
            <h3 class="section-title mb-1">Create Account</h3>
            <p class="muted-note mb-4">Sign up to access the Inventory and Orders dashboard.</p>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="registerName" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="registerEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="registerPassword" class="form-control" minlength="6" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>

            <p class="mt-3 mb-0 text-center text-secondary">
              Already have an account?
              <a href="/login-page" class="text-decoration-none">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/ui/js/auth_state.js"></script>
  <script src="/ui/js/common.js"></script>
  <script src="/ui/js/auth.js"></script>
</body>
</html>
