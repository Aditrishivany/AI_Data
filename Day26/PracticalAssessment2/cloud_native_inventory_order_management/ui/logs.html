<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/styles.css?v=20260228b">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Inventory System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/users-page">Users</a>
        <a class="nav-link" href="/products-page">Products</a>
        <a class="nav-link" href="/inventory-page">Inventory</a>
        <a class="nav-link" href="/orders-page">Orders</a>
        <a class="nav-link active" href="/logs-page">Activity Logs</a>
      </div>
      <div class="navbar-nav ms-auto" id="authNav"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="logsMessage" class="alert d-none"></div>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card page-card">
          <div class="card-body">
            <h5 class="section-title">Manual Log Entry</h5>
            <form id="logForm">
              <div class="mb-3">
                <label class="form-label">Action</label>
                <input class="form-control" id="logAction" value="INFO" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Entity</label>
                <input class="form-control" id="logEntity" value="SYSTEM" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Details</label>
                <textarea class="form-control" id="logDetails" rows="3" required></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Save Log</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card page-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="section-title mb-0">MongoDB Activity Logs</h5>
              <button class="btn btn-outline-secondary btn-sm" id="refreshLogsBtn">Refresh</button>
            </div>
            <div class="table-responsive mt-3">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Action</th>
                    <th>Entity</th>
                    <th>Details</th>
                    <th>Timestamp</th>
                  </tr>
                </thead>
                <tbody id="logsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/ui/js/auth_state.js"></script>
  <script src="/ui/js/common.js"></script>
  <script src="/ui/js/logs.js"></script>
</body>
</html>
