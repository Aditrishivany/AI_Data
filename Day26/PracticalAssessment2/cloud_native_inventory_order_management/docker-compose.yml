version: "3.9"

services:
  api:
    build: .
    container_name: inventory_api
    ports:
      - "8000:8000"
    environment:
      MYSQL_URL: mysql+pymysql://root:root123@mysql:3306/inventory_db
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: inventory_activity_db
      MONGODB_COLLECTION_NAME: activity_logs
      AUTO_CREATE_TABLES: "true"
    depends_on:
      - mysql
      - mongo
    command: >
      sh -c "
      python -m src.seed &&
      uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./:/app

  mysql:
    image: mysql:8.0
    container_name: inventory_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: inventory_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
