{% extends "base.html" %}
{% block content %}

<div class="fade-in">

<h2 class="fw-bold mb-4">Products</h2>

<div class="row">
  {% for p in products %}
  <div class="col-md-4 mb-4">

    <a href="{{ url_for('product_detail', product_id=p.id) }}"
       style="text-decoration:none; color:inherit;">

      <div class="card-modern p-4 h-100 text-center shadow-sm">

        {% if p.image %}
          {% if p.image.startswith('http') %}
            <img src="{{ p.image }}"
                 class="w-100 rounded-4 mb-3"
                 style="height:240px; object-fit:cover;">
          {% else %}
            <img src="{{ url_for('static', filename='uploads/' + p.image) }}"
                 class="w-100 rounded-4 mb-3"
                 style="height:240px; object-fit:cover;">
          {% endif %}
        {% else %}
          <img src="https://via.placeholder.com/300"
               class="w-100 rounded-4 mb-3"
               style="height:240px; object-fit:cover;">
        {% endif %}

        <h5 class="fw-bold mb-2">{{ p.name }}</h5>
        <p class="text-muted fs-5 mb-3">₹{{ p.price }}</p>

        <div class="btn-gradient px-4 py-2 rounded-3 d-inline-block">
          View Details
        </div>

      </div>

    </a>

  </div>
  {% endfor %}
</div>

</div>

{% endblock %}
