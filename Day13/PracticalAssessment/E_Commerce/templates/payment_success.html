{% extends "base.html" %}
{% block content %}

<div class="container">
  <div class="card shadow p-5 mt-5 text-center">

    <h2 class="text-success fw-bold">
      Payment Successful!
    </h2>

    <p class="mt-3">
      Your order has been placed successfully.
    </p>

    <h4 class="mt-3">
      Total Paid: ₹{{ total }}
    </h4>

    <a href="{{ url_for('products') }}"
       class="btn btn-primary mt-4">
       Continue Shopping
    </a>

  </div>
</div>

{% endblock %}
