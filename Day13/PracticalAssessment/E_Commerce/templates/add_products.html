{% extends "base.html" %}
{% block content %}

<div class="fade-in">

<div class="container d-flex justify-content-center">
  <div class="card shadow p-4 mt-4"
       style="max-width: 600px; width: 100%; border-radius: 16px;">

    <h2 class="fw-bold mb-4 text-center">Add New Product</h2>

    <form method="POST" enctype="multipart/form-data">

      <!-- Product Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Product Name</label>
        <input name="name"
               class="form-control"
               placeholder="Enter product name"
               required>
      </div>

      <!-- Price -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Price (₹)</label>
        <input name="price"
               type="number"
               class="form-control"
               placeholder="Enter price"
               required>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description"
                  class="form-control"
                  rows="4"
                  placeholder="Enter product description"
                  required></textarea>
      </div>

      <!-- Image Upload -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Product Image</label>
        <input type="file"
               name="image"
               class="form-control"
               required>
      </div>

      <!-- Add Product Button -->
      <button class="btn btn-gradient w-100 py-2 mt-3" style="font-size: 1rem;">
        Add Product
      </button>

    </form>

  </div>
</div>

</div>

{% endblock %}
