{% extends "base.html" %}
{% block content %}

<div class="fade-in">

<div class="container">

  <div class="card shadow p-4 mt-4" style="border-radius: 16px;">
    <h2 class="fw-bold mb-4">Your Cart</h2>

    {% if products %}

      {% for p in products %}
      <div class="d-flex justify-content-between align-items-center border-bottom py-3">
        <span class="fw-semibold">{{ p.name }}</span>
        <strong class="text-success">₹{{ p.price }}</strong>
      </div>
      {% endfor %}

      <h3 class="mt-4 text-success fw-bold">Total: ₹{{ total }}</h3>

      <a href="{{ url_for('checkout') }}" 
         class="btn btn-gradient w-100 py-2 mt-4"
         style="font-size: 1.1rem;">
        Proceed to Checkout →
      </a>

    {% else %}
      <p class="text-muted">Your cart is empty.</p>

      <a href="{{ url_for('products') }}" 
         class="btn btn-outline-secondary mt-3 px-4 py-2">
        ← Continue Shopping
      </a>
    {% endif %}

  </div>

</div>

</div>

{% endblock %}
