{% extends "base.html" %}
{% block content %}

<div class="container">
  <div class="card shadow p-4 mt-4">

    <h2 class="fw-bold mb-4">Order Summary</h2>

    {% for p in products %}
    <div class="d-flex justify-content-between border-bottom py-2">
      <span>{{ p.name }}</span>
      <span>₹{{ p.price }}</span>
    </div>
    {% endfor %}

    <h3 class="mt-4 text-success fw-bold">
      Total: ₹{{ total }}
    </h3>

    <a href="{{ url_for('payment') }}"
       class="btn btn-primary w-100 mt-4 py-2">
       Proceed to Payment →
    </a>

  </div>
</div>

{% endblock %}
