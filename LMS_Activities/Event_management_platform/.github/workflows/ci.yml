name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SQL_DATABASE_URL: "sqlite:///./ci_test.db"
          ALLOW_SQLITE_AUTO_CREATE: "true"
        run: pytest

      - name: Build Docker image
        run: docker build -t event-management-platform:${{ github.sha }} .

