<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Inventory System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/users-page">Users</a>
        <a class="nav-link" href="/products-page">Products</a>
        <a class="nav-link active" href="/inventory-page">Inventory</a>
        <a class="nav-link" href="/orders-page">Orders</a>
        <a class="nav-link" href="/logs-page">Activity Logs</a>
      </div>
      <div class="navbar-nav ms-auto" id="authNav"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="inventoryMessage" class="alert d-none"></div>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card page-card">
          <div class="card-body">
            <h5 class="section-title">Add Inventory Item</h5>
            <form id="inventoryForm">
              <div class="mb-3">
                <label class="form-label">Product</label>
                <select id="inventoryProductId" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" id="inventoryQuantity" min="0" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Save Inventory</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card page-card">
          <div class="card-body">
            <h5 class="section-title">Inventory List</h5>
            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Update</th>
                    <th>Delete</th>
                  </tr>
                </thead>
                <tbody id="inventoryTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/ui/js/auth_state.js"></script>
  <script src="/ui/js/common.js"></script>
  <script src="/ui/js/inventory.js"></script>
</body>
</html>
