<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Inventory System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/users-page">Users</a>
        <a class="nav-link" href="/products-page">Products</a>
        <a class="nav-link" href="/inventory-page">Inventory</a>
        <a class="nav-link active" href="/orders-page">Orders</a>
        <a class="nav-link" href="/logs-page">Activity Logs</a>
      </div>
      <div class="navbar-nav ms-auto" id="authNav"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="ordersMessage" class="alert d-none"></div>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card page-card">
          <div class="card-body">
            <h5 class="section-title">Create Order</h5>
            <form id="orderForm">
              <div class="mb-3">
                <label class="form-label">User</label>
                <select id="orderUserId" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Product</label>
                <select id="orderProductId" class="form-select"></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" min="1" id="orderQuantity" class="form-control" value="1">
              </div>
              <button class="btn btn-outline-primary w-100 mb-2" type="button" id="addItemBtn">Add Item</button>
              <ul id="selectedItems" class="list-group mb-3"></ul>
              <button class="btn btn-primary w-100" type="submit">Create Order</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card page-card">
          <div class="card-body">
            <h5 class="section-title">Order List & Details</h5>
            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>Order ID</th>
                    <th>User ID</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Items</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/ui/js/auth_state.js"></script>
  <script src="/ui/js/common.js"></script>
  <script src="/ui/js/orders.js"></script>
</body>
</html>
