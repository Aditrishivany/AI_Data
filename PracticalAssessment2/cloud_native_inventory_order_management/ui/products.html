<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Inventory System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/users-page">Users</a>
        <a class="nav-link active" href="/products-page">Products</a>
        <a class="nav-link" href="/inventory-page">Inventory</a>
        <a class="nav-link" href="/orders-page">Orders</a>
        <a class="nav-link" href="/logs-page">Activity Logs</a>
      </div>
      <div class="navbar-nav ms-auto" id="authNav"></div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="productsMessage" class="alert d-none"></div>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card page-card fade-up">
          <div class="card-body">
            <h5 class="section-title">Add Product</h5>
            <form id="productForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="productName" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="productDescription" rows="3"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" id="productPrice" min="1" step="0.01" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Image URL (Optional)</label>
                <input type="url" class="form-control" id="productImageUrl" placeholder="https://...">
              </div>
              <button class="btn btn-primary w-100" type="submit">Save Product</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card page-card fade-up">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="section-title mb-0">Product Gallery</h5>
              <div class="d-flex gap-2">
                <input type="text" id="productSearch" class="form-control form-control-sm" placeholder="Search products">
                <select id="productSort" class="form-select form-select-sm">
                  <option value="latest">Latest</option>
                  <option value="priceLow">Price: Low to High</option>
                  <option value="priceHigh">Price: High to Low</option>
                  <option value="nameAZ">Name: A to Z</option>
                </select>
              </div>
            </div>
            <div id="productStats" class="d-flex flex-wrap gap-2 mb-3"></div>
            <div id="productsGrid" class="products-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/ui/js/auth_state.js"></script>
  <script src="/ui/js/common.js"></script>
  <script src="/ui/js/products.js"></script>
</body>
</html>
