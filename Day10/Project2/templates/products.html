{% extends "base.html" %}
{% block content %}

<div class="fade-in">

<h2 class="fw-bold mb-4">Products</h2>

<!-- Filters Section -->
<form method="GET" class="row mb-4">

  <div class="col-md-4 mb-2">
    <input name="search"
           class="form-control"
           placeholder="Search products..."
           value="{{ request.args.get('search','') }}">
  </div>

  <div class="col-md-4 mb-2">
    <input name="price"
           class="form-control"
           placeholder="Max price"
           value="{{ request.args.get('price','') }}">
  </div>

  <div class="col-md-4 mb-2">
    <button class="btn btn-gradient w-100 py-2">Filter</button>
  </div>

</form>

<!-- Product Grid -->
<div class="row">
  {% for p in products %}
  <div class="col-md-4 mb-4">
    <a href="{{ url_for('product_detail', product_id=p.id) }}"
       style="text-decoration:none; color:inherit;">

      <div class="card product-card shadow-sm h-100">

        <img src="{{ url_for('static', filename='uploads/' + p.image) }}"
             class="product-image">

        <div class="card-body text-center">
          <h5 class="fw-bold">{{ p.name }}</h5>
          <p class="text-muted mb-2">₹{{ p.price }}</p>

          <!-- View Details Button -->
          <button class="btn btn-gradient btn-sm px-3">
            View Details
          </button>

        </div>

      </div>

    </a>
  </div>
  {% endfor %}
</div>

<!-- Add Product Button for Admin -->
{% if current_user.is_admin %}
  <a href="{{ url_for('add_product') }}" class="btn btn-gradient mt-4 px-4 py-2">
    Add Product
  </a>
{% endif %}

</div>

{% endblock %}
