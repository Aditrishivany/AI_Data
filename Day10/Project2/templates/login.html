{% extends "base.html" %}
{% block content %}

<div class="fade-in">

<div class="container d-flex justify-content-center">
  <div class="card shadow p-4 mt-5"
       style="max-width: 430px; width: 100%; border-radius: 16px;">

    <h2 class="fw-bold text-center mb-4">Login</h2>

    <form method="POST">

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input name="username"
               class="form-control"
               placeholder="Enter username"
               required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input name="password"
               type="password"
               class="form-control"
               placeholder="Enter password"
               required>
      </div>

      <!-- Login Button -->
      <button class="btn btn-gradient w-100 py-2 mt-2" style="font-size: 1rem;">
          Login
      </button>

      <!-- Register Link -->
      <p class="text-center mt-3">
        Don’t have an account?
        <a href="{{ url_for('register') }}" class="fw-semibold">Register</a>
      </p>

    </form>
  </div>
</div>

</div>

{% endblock %}
